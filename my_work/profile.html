<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MyShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f5f6f8; color: #222; }
        .navbar { height: 70px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 6%; border-bottom: 1px solid #ddd; }
        .logo { font-size: 25px; font-weight: bold; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { text-decoration: none; color: #222; transition: color 0.3s; }
        .nav-links a:hover { color: #666; }
        .nav-links a.active { color: #ff4757; font-weight: bold; cursor: default; }

        .profile-container { max-width: 600px; margin: 50px auto; padding: 0 6%; }
        .profile-card { background: white; padding: 30px; border-radius: 10px; border: 1px solid #ddd; }
        .profile-card h2 { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .profile-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .profile-row:last-of-type { border-bottom: none; }
        .profile-label { font-weight: bold; color: #555; }
        .profile-value { color: #222; }
        .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .role-buyer { background: #d4edda; color: #155724; }
        .role-seller { background: #cce5ff; color: #004085; }

        .edit-form { display: none; }
        .edit-form .form-group { margin-bottom: 15px; }
        .edit-form .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .edit-form .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; }

        .edit-btn { width: 100%; background: #111; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 25px; font-weight: bold; }
        .edit-btn:hover { background: #333; }
        .save-btn { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; font-weight: bold; }
        .save-btn:hover { background: #218838; }
        .cancel-btn { width: 100%; background: #6c757d; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; }
        .cancel-btn:hover { background: #5a6268; }
        .delete-btn { width: 100%; background: #ff4757; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; font-weight: bold; }
        .delete-btn:hover { background: #e04050; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">MyShop</div>
        <nav class="nav-links">
            <a href="../pradeep.html/home.html">Home</a>
            <a href="../pradeep.html/products.html">Products</a>
            <a href="cart.html">My Cart</a>
            <a href="my_orders.html">My Orders</a>
            <a href="javascript:void(0)" class="active">Profile</a>
            <a href="../pradeep.html/login.html" onclick="localStorage.removeItem('loggedIn')">Logout</a>
        </nav>
    </header>

    <section class="profile-container">
        <!-- VIEW MODE -->
        <div class="profile-card" id="view-mode">
            <h2>My Profile</h2>
            <div class="profile-row">
                <span class="profile-label">Full Name</span>
                <span class="profile-value" id="display-name"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Email</span>
                <span class="profile-value" id="display-email"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Phone</span>
                <span class="profile-value" id="display-phone"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Role</span>
                <span id="display-role"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Favourite Place</span>
                <span class="profile-value" id="display-place"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Favourite Person</span>
                <span class="profile-value" id="display-person"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Hobby</span>
                <span class="profile-value" id="display-hobby"></span>
            </div>
            <button class="edit-btn" onclick="showEditMode()">Edit Profile</button>
            <button class="delete-btn" onclick="deleteAccount()">Delete Account</button>
        </div>

        <!-- EDIT MODE -->
        <div class="profile-card edit-form" id="edit-mode">
            <h2>Edit Profile</h2>
            <form onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="edit-phone" required>
                </div>
                <div class="form-group">
                    <label>Favourite Place</label>
                    <input type="text" id="edit-place" required>
                </div>
                <div class="form-group">
                    <label>Favourite Person</label>
                    <input type="text" id="edit-person" required>
                </div>
                <div class="form-group">
                    <label>Hobby</label>
                    <input type="text" id="edit-hobby" required>
                </div>
                <button type="submit" class="save-btn">Save Changes</button>
                <button type="button" class="cancel-btn" onclick="cancelEdit()">Cancel</button>
            </form>
        </div>
    </section>

    <script>
        window.onload = function() {
            var savedUser = localStorage.getItem('user');
            if (!savedUser) {
                alert('Please login first.');
                window.location.href = '../pradeep.html/login.html';
                return;
            }
            loadProfile();
        };

        function loadProfile() {
            var user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('display-name').textContent = user.name || '';
            document.getElementById('display-email').textContent = user.email || '';
            document.getElementById('display-phone').textContent = user.phone || '';
            document.getElementById('display-place').textContent = user.favPlace || 'Not set';
            document.getElementById('display-person').textContent = user.favPerson || 'Not set';
            document.getElementById('display-hobby').textContent = user.hobby || 'Not set';

            var roleEl = document.getElementById('display-role');
            if (user.role === 'buyer') {
                roleEl.innerHTML = '<span class="role-badge role-buyer">Buyer</span>';
            } else if (user.role === 'seller') {
                roleEl.innerHTML = '<span class="role-badge role-seller">Seller</span>';
            } else {
                roleEl.textContent = user.role || 'Not set';
            }
        }

        function showEditMode() {
            var user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('edit-name').value = user.name || '';
            document.getElementById('edit-email').value = user.email || '';
            document.getElementById('edit-phone').value = user.phone || '';
            document.getElementById('edit-place').value = user.favPlace || '';
            document.getElementById('edit-person').value = user.favPerson || '';
            document.getElementById('edit-hobby').value = user.hobby || '';

            document.getElementById('view-mode').style.display = 'none';
            document.getElementById('edit-mode').style.display = 'block';
        }

        function cancelEdit() {
            document.getElementById('edit-mode').style.display = 'none';
            document.getElementById('view-mode').style.display = 'block';
        }

        function saveProfile(event) {
            event.preventDefault();
            var user = JSON.parse(localStorage.getItem('user'));
            user.name = document.getElementById('edit-name').value;
            user.email = document.getElementById('edit-email').value;
            user.phone = document.getElementById('edit-phone').value;
            user.favPlace = document.getElementById('edit-place').value;
            user.favPerson = document.getElementById('edit-person').value;
            user.hobby = document.getElementById('edit-hobby').value;
            localStorage.setItem('user', JSON.stringify(user));
            alert('Profile updated successfully!');
            document.getElementById('edit-mode').style.display = 'none';
            document.getElementById('view-mode').style.display = 'block';
            loadProfile();
        }

        function deleteAccount() {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                if (confirm('This will permanently remove all your data. Confirm deletion?')) {
                    localStorage.removeItem('user');
                    localStorage.removeItem('loggedIn');
                    alert('Your account has been deleted successfully.');
                    window.location.href = '../pradeep.html/registration.html';
                }
            }
        }
    </script>
</body>
</html>
