<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - MyShop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #666;
        }

        .nav-links a.active {
            color: #ff4757;
            font-weight: bold;
            cursor: default;
        }

        /* CART SECTION */
        .cart-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 6%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .cart-items h2 {
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .item-info img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-details h4 {
            margin-bottom: 5px;
        }

        .item-details p {
            color: #777;
            font-size: 14px;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-quantity input {
            width: 50px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .item-price {
            font-weight: bold;
            font-size: 18px;
        }

        .buy-now-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .buy-now-btn:hover {
            background: #218838;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        /* ORDER SUMMARY */
        .order-summary {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
            height: fit-content;
        }

        .order-summary h3 {
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            background: #111;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 25px;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background: #333;
        }

        @media(max-width:900px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">MyShop</div>
        <nav class="nav-links">
            <a href="../pradeep.html/home.html">Home</a>
            <a href="../pradeep.html/products.html">Products</a>
            <a href="javascript:void(0)" class="active">My Cart</a>
            <a href="my_orders.html">My Orders</a>
            <a href="profile.html">Profile</a>
            <a href="#">Logout</a>
        </nav>
    </header>

    <!-- CART PAGE -->
    <section class="cart-container">
        
        <!-- Cart Items List -->
        <div class="cart-items">
            <h2>Shopping Cart</h2>
            
            <div id="cart-list-container">
                <!-- Dynamically populated from localStorage.getItem('cart') -->
            </div>

        </div>

        <!-- Order Summary -->
        <div class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="summary-subtotal">₹0</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span id="summary-shipping">₹0</span>
            </div>
            <div class="summary-row">
                <span>Tax (GST 5%)</span>
                <span id="summary-tax">₹0</span>
            </div>
            
            <div class="summary-total">
                <span>Total</span>
                <span id="summary-total">₹0</span>
            </div>

            <button class="checkout-btn" id="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
        </div>

    </section>

    <script>
        function getCart() {
            try {
                return JSON.parse(localStorage.getItem('cart') || '[]');
            } catch(e) {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        window.onload = function() {
            renderCart();
        };

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cart-list-container');
            const checkoutBtn = document.getElementById('checkout-btn');

            if (!cart || cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 10px;">
                        <p style="font-size: 18px; color: #666; margin-bottom: 20px;">Your shopping cart is currently empty!</p>
                        <a href="../pradeep.html/home.html#products" 
                           style="display: inline-block; background: #111; color: white; padding: 12px 24px; border-radius: 5px; text-decoration: none; font-weight: bold;">
                           Browse Products
                        </a>
                    </div>
                `;
                document.getElementById('summary-subtotal').textContent = '₹0';
                document.getElementById('summary-shipping').textContent = '₹0';
                document.getElementById('summary-tax').textContent = '₹0';
                document.getElementById('summary-total').textContent = '₹0';
                checkoutBtn.disabled = true;
                checkoutBtn.style.opacity = '0.5';
                checkoutBtn.style.cursor = 'not-allowed';
                return;
            }

            checkoutBtn.disabled = false;
            checkoutBtn.style.opacity = '1';
            checkoutBtn.style.cursor = 'pointer';

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = (item.price || 0) * (item.quantity || 1);
                subtotal += itemTotal;
                const maxStock = item.maxStock || 10;

                html += `
                    <div class="cart-item" id="item-${index}">
                        <div class="item-info">
                            <img src="${item.image || 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600'}" alt="${item.name}">
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <p>${item.category || ''} ${item.size ? '• Size: ' + item.size : ''}</p>
                            </div>
                        </div>
                        <div class="item-quantity">
                            <label for="qty-${index}">Qty:</label>
                            <input type="number" id="qty-${index}" value="${item.quantity}" min="1" max="${maxStock}" 
                                   onchange="updateItemQty(${index}, this.value, ${maxStock})">
                        </div>
                        <div class="item-price">₹${(item.price || 0).toLocaleString('en-IN')}</div>
                        <div style="display: flex; gap: 10px;">
                            <button class="buy-now-btn" onclick="buySingleItem(${index})">Buy Now</button>
                            <button class="remove-btn" onclick="removeCartItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            const shipping = subtotal > 0 ? 100 : 0;
            const tax = Math.round(subtotal * 0.05);
            const total = subtotal + shipping + tax;

            document.getElementById('summary-subtotal').textContent = '₹' + subtotal.toLocaleString('en-IN');
            document.getElementById('summary-shipping').textContent = '₹' + shipping.toLocaleString('en-IN');
            document.getElementById('summary-tax').textContent = '₹' + tax.toLocaleString('en-IN');
            document.getElementById('summary-total').textContent = '₹' + total.toLocaleString('en-IN');
        }

        function updateItemQty(index, newQty, maxStock) {
            let qty = parseInt(newQty);
            if (isNaN(qty) || qty < 1) {
                alert("Quantity cannot be less than 1.");
                qty = 1;
            } else if (qty > maxStock) {
                alert("Sorry, only " + maxStock + " units are currently available in stock.");
                qty = maxStock;
            }

            const cart = getCart();
            if (cart[index]) {
                cart[index].quantity = qty;
                saveCart(cart);
                renderCart();
            }
        }

        function removeCartItem(index) {
            const cart = getCart();
            if (confirm("Remove this item from your cart?")) {
                cart.splice(index, 1);
                saveCart(cart);
                renderCart();
            }
        }

        function buySingleItem(index) {
            const cart = getCart();
            const item = cart[index];
            if (!item) return;

            // Save single item checkout
            sessionStorage.setItem('directBuyItem', JSON.stringify(item));
            sessionStorage.setItem('directBuyCartIndex', index.toString());
            window.location.href = 'checkout.html';
        }

        function goToCheckout() {
            const cart = getCart();
            if (!cart || cart.length === 0) {
                alert("Your cart is empty. Add products before proceeding to checkout.");
                return;
            }
            sessionStorage.removeItem('directBuyItem');
            sessionStorage.removeItem('directBuyCartIndex');
            window.location.href = 'checkout.html';
        }
    </script>

</body>
</html>
