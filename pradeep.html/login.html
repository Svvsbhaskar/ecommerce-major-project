```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MyShop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #111;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>MyShop</h1>

    <p class="subtitle">
        Login to your account
    </p>


    <form onsubmit="loginUser(event)">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="registration.html">
            Create Account
        </a>

    </div>

</div>


<script>

function loginUser(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const savedUser =
        localStorage.getItem("user");


    if (!savedUser) {

        alert(
            "Please register an account first."
        );

        return;
    }


    const user =
        JSON.parse(savedUser);


    if (
        email === user.email &&
        password === user.password
    ) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );


        alert("Login successful!");


        window.location.href =
            "dashboard.html";

    }

    else {

        alert(
            "Invalid email or password."
        );

    }

}

</script>


</body>
</html>
